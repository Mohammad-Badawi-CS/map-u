<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد الدور التقريبي</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 5px; }
        .result { margin-top: 20px; font-size: 18px; }
        .floor { font-size: 32px; font-weight: bold; color: #28a745; margin: 10px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>محدد الطابق التقريبي</h2>
    
    <!-- زر لمعايرة الدور الأرضي أول مرة -->
    <button onclick="setGroundFloor()">1. ضبط الدور الأرضي هنا</button>
    <br>
    <!-- زر لحساب الدور الحالي -->
    <button onclick="calculateCurrentFloor()">2. حدد دوري الحالي</button>

    <div class="result">
        <p>ارتفاع الدور الأرضي: <span id="groundLevel">لم يُحدد</span></p>
        <p>الارتفاع الحالي عن البحر: <span id="currentAlt">--</span> م</p>
        <p>الدور التقريبي:</p>
        <div class="floor" id="floorNum">--</div>
        <small style="color: gray;">نسبة الدقة: ±<span id="accuracy">--</span> م</small>
    </div>
</div>

<script>
    let groundAltitude = null;
    const FLOOR_HEIGHT = 3.2; // متوسط ارتفاع الدور بالمتر

    const geoOptions = {
        enableHighAccuracy: true, // تفعيل أعلى دقة ممكنة عبر GPS
        timeout: 10000,
        maximumAge: 0
    };

    // خطوة 1: تسجيل ارتفاع الدور الأرضي
    function setGroundFloor() {
        if (!navigator.geolocation) {
            alert("المتصفح لا يدعم تحديد الموقع");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const alt = pos.coords.altitude;
                if (alt === null) {
                    alert("تعذر قراءة الارتفاع، تأكد من تفعيل GPS والتواجد في مكان مفتوح للإشارة.");
                    return;
                }
                groundAltitude = alt;
                document.getElementById('groundLevel').innerText = alt.toFixed(1) + " م";
                alert("تمت المعايرة بنجاح!");
            },
            (err) => alert("خطأ: " + err.message),
            geoOptions
        );
    }

    // خطوة 2: قراءة الارتفاع الحالي وحساب الفارق
    function calculateCurrentFloor() {
        if (groundAltitude === null) {
            alert("يرجى ضبط الدور الأرضي أولاً كنقطة مرجعية.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const currentAlt = pos.coords.altitude;
                const accuracy = pos.coords.altitudeAccuracy || pos.coords.accuracy;

                if (currentAlt === null) {
                    alert("المتصفح لم يستطع جلب قراءة الارتفاع.");
                    return;
                }

                document.getElementById('currentAlt').innerText = currentAlt.toFixed(1);
                document.getElementById('accuracy').innerText = accuracy ? accuracy.toFixed(1) : "غير متوفرة";

                // الحساب: (الارتفاع الحالي - ارتفاع الأرضي) / متوسط ارتفاع الدور
                const diff = currentAlt - groundAltitude;
                const estimatedFloor = Math.round(diff / FLOOR_HEIGHT);

                // عرض النتيجة
                if (estimatedFloor <= 0) {
                    document.getElementById('floorNum').innerText = "الدور الأرضي (أو قبو)";
                } else {
                    document.getElementById('floorNum').innerText = "الدور " + estimatedFloor;
                }
            },
            (err) => alert("خطأ: " + err.message),
            geoOptions
        );
    }
</script>

</body>
</html>
